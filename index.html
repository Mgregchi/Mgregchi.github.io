    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #000
      }

      html {
        height: -webkit-fill-available;
      }

      body {
        position: fixed;
        inset: 0;
        height: -webkit-fill-available;
      }

      .viewport {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="viewport">
      <iframe src="https://mgregchi.idey.click"></iframe>
    </div>

    <script>
      document.addEventListener(
        "touchmove",
        function (e) {
          if (!e.target.closest(".viewport")) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
    </script>
  </body>
